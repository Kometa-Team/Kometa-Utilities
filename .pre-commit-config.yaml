# Pre-commit hooks for code quality and PEP8 enforcement
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]

  # Import sorting with isort (compatible with Black)
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # Linting with flake8 (PEP8 + more)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,E501,W503
          - --exclude=.git,__pycache__,.pytest_cache,.venv,venv,htmlcov
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear

  # General file cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, --recursive, --quiet]
        additional_dependencies: ["bandit[toml]"]
        exclude: (^|/)(tests?/|test_[^/]+\.py$)

  # Type checking with mypy (root level)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (root)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        exclude: ^(tests/|anidb-service/|plex-oauth/|mal-oauth/|trakt-oauth/|simkl-service/|imdb-service/|wetrakr-oauth/)

  # Type checking with mypy (anidb-service)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (anidb-service)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        files: ^anidb-service/.*\.py$
        exclude: ^anidb-service/tests?/

      - id: mypy
        name: mypy (simkl-service)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        files: ^simkl-service/.*\.py$
        exclude: ^simkl-service/tests?/

      - id: mypy
        name: mypy (plex-oauth)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        files: ^plex-oauth/plex_oauth/.*\.py$

      - id: mypy
        name: mypy (mal-oauth)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        files: ^mal-oauth/mal_oauth/.*\.py$

      - id: mypy
        name: mypy (trakt_oauth)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        files: ^trakt-oauth/trakt_oauth/.*\.py$

      - id: mypy
        name: mypy (imdb-service)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
          - aiosqlite
          - fastapi
          - httpx
        files: ^imdb-service/.*\.py$
        exclude: ^imdb-service/tests?/

      - id: mypy
        name: mypy (wetrakr_oauth)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-aiofiles
        files: ^wetrakr-oauth/wetrakr_oauth/.*\.py$
