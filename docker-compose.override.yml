services:
  anidb-mirror:
    pull_policy: build
    build:
      context: ./anidb-service
      dockerfile: Dockerfile

  plex-oauth:
    pull_policy: build
    build:
      context: ./plex-oauth
      dockerfile: Dockerfile

  trakt-oauth:
    pull_policy: build
    build:
      context: ./trakt-oauth
      dockerfile: Dockerfile

  mal-oauth:
    pull_policy: build
    build:
      context: ./mal-oauth
      dockerfile: Dockerfile

  simkl-oauth:
    pull_policy: build
    build:
      context: ./simkl-oauth
      dockerfile: Dockerfile

  imdb-service:
    pull_policy: build
    build:
      context: ./imdb-service
      dockerfile: Dockerfile
    command: bash -c "pip install python-multipart && uvicorn main:app --host 0.0.0.0 --port 8000"
